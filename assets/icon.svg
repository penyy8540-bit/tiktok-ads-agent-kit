<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="TikTok Ads plugin">
  <defs>
    <linearGradient id="adsBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1f2a"/>
      <stop offset="1" stop-color="#0c0e14"/>
    </linearGradient>
    <linearGradient id="adsAccent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#25f4ee"/>
      <stop offset="0.55" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#fe2c55"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#adsBackground)"/>
  <!-- rising performance bars -->
  <g fill="url(#adsAccent)">
    <rect x="14" y="38" width="6.5" height="12" rx="2.4"/>
    <rect x="24.5" y="30" width="6.5" height="20" rx="2.4"/>
    <rect x="35" y="22" width="6.5" height="28" rx="2.4"/>
  </g>
  <!-- campaign play mark -->
  <path d="M45.5 19.5c0-1.1 1.2-1.8 2.2-1.2l8 4.7c1 .6 1 2 0 2.6l-8 4.7c-1 .6-2.2-.1-2.2-1.2z" fill="#fe2c55"/>
  <path d="M45.5 19.5c0-1.1 1.2-1.8 2.2-1.2l3 1.76-3 1.76c-1 .6-2.2-.1-2.2-1.2z" fill="#25f4ee" opacity="0.85"/>
  <!-- baseline -->
  <rect x="12" y="52" width="40" height="2.6" rx="1.3" fill="#ffffff" opacity="0.22"/>
</svg>
